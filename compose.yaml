services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: prediction_market
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: prediction_market
    ports:
      - "127.0.0.1:5433:5432"
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prediction_market -d prediction_market"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
