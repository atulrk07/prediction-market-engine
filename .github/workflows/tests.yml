name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: prediction_market
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: prediction_market_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U prediction_market -d prediction_market_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://prediction_market:local_dev_password@127.0.0.1:5434/prediction_market_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Apply test database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head
      - name: Run tests with mocked exchange HTTP and real PostgreSQL
        run: python -m pytest -q
      - name: Check dashboard loading and response ordering
        run: node --test tests/test_dashboard.cjs
      - name: Build and start Compose API with migrations
        run: |
          cp watchlist.example.json watchlist.json
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait --wait-timeout 90 api
      - name: Check container API and installed worker command without Kalshi access
        run: |
          curl --fail --silent --show-error --connect-timeout 2 --max-time 10 http://127.0.0.1:8000/ready
          curl --fail --silent --show-error --connect-timeout 2 --max-time 10 http://127.0.0.1:8000/dashboard --output "$RUNNER_TEMP/dashboard.html"
          python -c 'import os; from pathlib import Path; assert "Market Monitor" in (Path(os.environ["RUNNER_TEMP"]) / "dashboard.html").read_text()'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 10 http://127.0.0.1:8000/markets | python -c 'import json, sys; assert json.load(sys.stdin) == []'
          docker compose run --rm --no-deps worker kalshi-worker --help
      - name: Verify synthetic quote survives container recreation
        run: |
          docker compose run --rm -T --no-deps worker python - <<'PY'
          from datetime import datetime, timezone
          from database import make_engine
          from normalize_quote import normalize_orderbook
          from persistence import minute_slot, save_observation

          ticker = "SYNTHETIC-CI-PERSISTENCE"
          market = {"ticker": ticker, "title": "Synthetic CI persistence check",
                    "status": "active", "market_type": "binary"}
          book = {"orderbook_fp": {"yes_dollars": [["0.4200", "10.00"]],
                                   "no_dollars": [["0.5500", "8.00"]]}}
          quote = normalize_orderbook(book, ticker, datetime.now(timezone.utc))
          engine = make_engine()
          try:
              print("SYNTHETIC CI observation:", save_observation(engine, market, quote, minute_slot(quote.observed_at)))
          finally:
              engine.dispose()
          PY
          curl --fail --silent --show-error --connect-timeout 2 --max-time 10 http://127.0.0.1:8000/markets/1/quote > "$RUNNER_TEMP/quote-before.json"
          docker compose down
          docker compose up -d --wait --wait-timeout 90 api
          curl --fail --silent --show-error --connect-timeout 2 --max-time 10 http://127.0.0.1:8000/markets/1/quote > "$RUNNER_TEMP/quote-after.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((folder / "quote-before.json").read_text())
          after = json.loads((folder / "quote-after.json").read_text())
          assert before["ticker"] == after["ticker"] == "SYNTHETIC-CI-PERSISTENCE"
          assert before["quote"]["yes_ask"] == "0.4500"
          for field in ("market_id", "snapshot_id", "ingestion_run_id", "collection_slot", "quote"):
              assert before[field] == after[field], field
          print("Synthetic quote and IDs survived container recreation; collection age may change.")
          PY
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop Compose services
        if: always()
        run: docker compose down
