[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-engine"
version = "0.0.1"
description = "Fetch and store Kalshi observations; serve metadata, latest quotes, and history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1", "pydantic==2.14.1", "SQLAlchemy==2.0.54",
    "alembic==1.20.0", "psycopg[binary]==3.3.6",
    "fastapi==0.143.0", "uvicorn==0.54.0",
]

[project.scripts]
kalshi-raw = "fetch_raw:main"
kalshi-quote = "fetch_quote:main"
kalshi-discover = "discover_markets:main"
kalshi-ingest = "ingest_quote:main"
kalshi-read = "read_quote:main"
kalshi-replay = "replay_quote:main"
kalshi-worker = "worker:main"
kalshi-run = "read_run:main"

[tool.setuptools]
py-modules = [
    "fetch_raw", "fetch_quote", "normalize_quote", "discover_markets",
    "models", "database", "persistence", "ingest_quote", "read_quote", "replay_quote",
    "api", "market_queries", "latest_quote", "history", "worker", "retrying", "run_records", "read_run", "alerts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a migrated, isolated PostgreSQL TEST_DATABASE_URL"]
